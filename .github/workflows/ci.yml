name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Pinned by commit rather than by tag: a tag can be moved to point at
      # different code, a commit cannot. Same convention as deploy.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Named rather than -r requirements.txt: the engine and its tests do not
        # need Streamlit, and installing it here would add a minute a run for a
        # dependency none of this exercises. openpyxl is here so the Excel tests
        # actually run - they skip themselves without it, which is worse than
        # failing.
        run: |
          python -m pip install --upgrade pip
          pip install pandas "pyshp>=3.1.6" "pyproj>=3.6.0" openpyxl pytest
      - name: Check the parity contract is in sync with its generator
        run: python scripts/gen_parity_fixtures.py --check
      - name: Run tests
        run: python -m pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Run tests
        run: npm test
        working-directory: web
